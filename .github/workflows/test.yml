name: test

# CLAUDE.md v1.0 §-1.7 / §10-1 準拠。
# Mac 上でしか動かない xcodebuild test をリポジトリ毎 push で実機(macOS runner)に
# 実行させる。Linux 側エージェントは静的監査までしか出来ないため、ここが
# 「test pass all」の唯一の機械的証明。

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcodebuild-test:
    name: xcodebuild test (iOS Simulator)
    # ローカル開発環境(Xcode 26.5 / iOS 26 SDK / iPhone 17)と CI を揃える。
    # `macos-26` は GA で Xcode 26.2 を default 採用し、iOS 26.1 / 26.2 / 26.4
    # simulator runtime と iPhone 17 系 / iPhone Air を preinstall する
    # (actions/runner-images images/macos/macos-26-arm64-Readme.md 参照)。
    runs-on: macos-26
    timeout-minutes: 30

    env:
      SCHEME: WorkoutKit
      # ローカル: Xcode 26.5 + iPhone 17 / iOS 26.x で 155/155 緑。
      # CI: iPhone 17 + OS=latest(macos-26 では iOS 26.4 が最新)に揃える。
      DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # macos-26 runner の default Xcode(26.2 / iOS 26 SDK 同梱)を使う。
          # 明示的な `xcode-select -s` は不要だが、バージョン記録のため出力する。
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Stub Secrets.xcconfig
        run: |
          # CI ではサンドボックスでも RevenueCat 設定をスキップさせる。
          # AppSecrets.revenueCatAPIKey は空 / placeholder のとき nil を返す。
          cat > Config/Secrets.xcconfig <<'EOF'
          REVENUECAT_API_KEY =
          EOF

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WorkoutKit.xcodeproj \
            -scheme "$SCHEME"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WorkoutKit.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project WorkoutKit.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:WorkoutKitTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          retention-days: 7
