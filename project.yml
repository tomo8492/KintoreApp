# project.yml
# CLAUDE.md §-1.7 / §-1.8 / §11 準拠。
# xcodegen で Xcode プロジェクトを生成する。手書き .pbxproj はマージ事故が
# 起きやすいので、本リポジトリは project.yml を真として扱う。
#
# 使い方:
#   $ xcodegen generate
# その後 WorkoutKit.xcodeproj/ がリポジトリ直下に再生成される。
# 生成物は .gitignore せず、初回のみコミットする(他開発者の Xcode 起動を楽にする)。

name: WorkoutKit
options:
  bundleIdPrefix: com.tomo
  # CLAUDE.md v0.5 §-1.1: iOS 17.0 → 18.0 (サブスク化に合わせ引き上げ)。
  # watchOS は v0.5 §-1.19 で Smart Stack Widget だけ提供する。
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  developmentLanguage: ja
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

# v0.5: RevenueCat を SPM で取り込み(課金 SDK)。
# - 公式 SDK 名は `purchases-ios`(produces `RevenueCat` モジュール)。
# - WorkoutKit target からのみ参照(Widget / Watch からは触らない)。
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

# Configurations は 3 種(CLAUDE.md §-1.7)。各 .xcconfig に紐付ける。
configs:
  Debug: debug
  Beta: release
  Release: release

# プロジェクト直下の configFiles はアプリ本体のデフォルト。
# Widget Extension は target 単位で別の xcconfig を割り当てる(下記 targets セクション)。
configFiles:
  Debug: Config/Debug.xcconfig
  Beta: Config/Beta.xcconfig
  Release: Config/Release.xcconfig

# 設定ファイル群と README を Xcode 上のグループとして見せる。
fileGroups:
  - Config
  - CLAUDE.md
  - README.md

targets:
  # ------------------------------------------------------------------
  # WorkoutKit (アプリ本体)
  # ------------------------------------------------------------------
  WorkoutKit:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WorkoutKit
        excludes:
          # 空ディレクトリ維持用、ビルドには不要
          - "**/.gitkeep"
          # entitlements は CODE_SIGN_ENTITLEMENTS から参照されるので
          # ソースファイルとしては扱わない(Bundle にも入れない)
          - "WorkoutKit.entitlements"
          # prompts は ChatGPT 用ドキュメント。アプリ Bundle には含めない
          - "Resources/prompts/**"
          - "Resources/prompts"
      # C3: Live Activity の ActivityAttributes は App と Widget の双方から
      # 参照する必要があるため、Widget 拡張ディレクトリ配下の1ファイルだけを
      # アプリ本体の sources にも個別追加する(モジュール境界を跨いだ型共有)。
      - path: WorkoutKitLiveActivity/SessionLiveActivityAttributes.swift
      # v1.0 §5-3: RestTimer 用 ActivityAttributes も同様に共有。
      # 本体側は Features/LiveActivity/ に正本を置き、Widget 側は本体のソースを
      # path 個別追加で参照する(Widget の sources に下のエントリを追加済み)。
    settings:
      base:
        # Entitlements (App Group)。CLAUDE.md §-1.5。
        CODE_SIGN_ENTITLEMENTS: WorkoutKit/WorkoutKit.entitlements
        # Info.plist は xcconfig の INFOPLIST_KEY_* と下記 properties をマージし、
        # ビルド時に自動生成する。手書き plist は禁止(CLAUDE.md §-1.7)。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # C3: Live Activity を出すには Info.plist に NSSupportsLiveActivities が必須。
        # GENERATE_INFOPLIST_FILE=YES 環境下では INFOPLIST_KEY_* で渡せる(Bool は YES/NO)。
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # App Store / TestFlight アップロード時の "Export Compliance" 自動応答。
        # 本アプリは Apple 純正の TLS / HTTPS / StoreKit 通信しか使わないため
        # 非標準暗号は使っていない = NO で OK。これを入れておかないと TF Upload の
        # たびに手動で「暗号化使ってますか?」ダイアログを通す必要が出る。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        # 個人開発のため自動署名に任せる(P-1 で Team を入れたら手動切替検討)。
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # C3: Widget Extension を本体に同梱して App Store / TestFlight に配布する。
      - target: WorkoutKitLiveActivity
      # Phase 2-2 (Watch 単体記録): watchOS companion app (WorkoutKitWatchApp) を追加した。
      # Apple のルール(watchOS extension は watchOS app の中に embed する)に従い、
      # Smart Stack Widget (WorkoutKitWatch) は WorkoutKitWatchApp の PlugIns に embed し、
      # iOS 本体は WorkoutKitWatchApp だけに依存する(以前の WorkoutKitWatch 直接依存 /
      # embed: false は廃止)。
      # ⚠ Mac 実機要検証: xcodegen はプラットフォーム watchOS の `application` ターゲットへの
      # 依存を検出すると "Embed Watch Content" コピーフェーズ
      # (dstPath: $(CONTENTS_FOLDER_PATH)/Watch, WatchKit2AppSubfolder) を自動生成する想定だが、
      # xcodegen 2.45.3 での実際の Build Phases 出力は `xcodegen generate` 後に
      # Xcode で目視確認すること。想定と異なる場合は明示的なコピーフェーズを追加する。
      - target: WorkoutKitWatchApp
        embed: true
      # v0.5 §-1.1: RevenueCat(課金 SDK)。Purchases.shared は PurchaseManager 越しに利用する。
      - package: RevenueCat
        product: RevenueCat
    scheme:
      testTargets:
        - WorkoutKitTests
        - WorkoutKitUITests
      gatherCoverageData: true
      coverageTargets:
        - WorkoutKit
      # Run の StoreKit Configuration を WorkoutKit.storekit に固定する。
      # これが無いとシミュレータで Product.products(for:) が空配列を返し、
      # Paywall に "product not found" が出る(BUG 2 / F-08)。
      #
      # identifier path の解決ルール(Xcode 26 / xcodegen 2.45.3 で検証済み):
      #   - xcodegen は `../../WorkoutKit/Resources/WorkoutKit.storekit`
      #     形式で出力する(.xcodeproj/xcshareddata/ 基準で 2 階層上 → リポジトリルート)
      #   - Xcode IDE もこのパスを正しく解決する(Issue Navigator に warning 0 件)
      #   - 過去に「../WorkoutKit/... に手で書き換えるべし」とのメモがあったが、
      #     実際には xcodegen デフォルトの ../../ が正解。手書き不要。
      #
      # ⚠ シミュレータ起動方法に関する注意:
      #   `xcrun simctl launch` で直接起動すると Run スキームの StoreKit
      #   Configuration は適用されない(scheme は Xcode IDE が解釈する設定)。
      #   StoreKit Configuration を効かせるには Xcode の Run ボタン経由で起動する。
      storeKitConfiguration: WorkoutKit/Resources/WorkoutKit.storekit
      # ⚠ Run action の Sanitizer 設定について(xcodegen 2.45.3 制約):
      #   M9 Phase 7(自己テスト)用に Run action へ Address Sanitizer /
      #   Undefined Behavior Sanitizer を仕込んであるが、xcodegen 2.45.3 の
      #   target-scheme shorthand は `enableAddressSanitizer` 系キーを
      #   サポートしない(指定しても silently 無視される)。
      #   そのため `.xcscheme` の <LaunchAction> に直接
      #     enableAddressSanitizer = "YES"
      #     enableUBSanitizer = "YES"
      #   を書き込んでいる。xcodegen を再生成した場合はこの 2 属性が
      #   消えるので、`WorkoutKit.xcodeproj/xcshareddata/xcschemes/
      #   WorkoutKit.xcscheme` の <LaunchAction> 行に書き戻すこと。
      #   Main Thread Checker は Xcode 既定で ON。Thread Sanitizer は
      #   ASan と同時使用不可のため Edit Scheme で一時切替する運用。
      # Run/Test は Debug、Profile/Analyze は Release、Archive は Release。
      # Beta は TestFlight ビルド時に手動切替。
      configs:
        run: Debug
        test: Debug
        profile: Release
        analyze: Debug
        archive: Release

  # ------------------------------------------------------------------
  # WorkoutKitLiveActivity (Widget Extension, C3)
  # CLAUDE.md §1.1 F-03 / §-1.5 準拠。ActivityKit + WidgetKit ベースの
  # Live Activity を提供する。アプリ本体に同梱で配布。
  # ------------------------------------------------------------------
  WorkoutKitLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WorkoutKitLiveActivity
        excludes:
          - "**/.gitkeep"
          # 拡張専用 entitlements は CODE_SIGN_ENTITLEMENTS で渡すだけにする
          - "WorkoutKitLiveActivity.entitlements"
      # Widget Extension は別 Bundle なので、アプリ本体の String Catalog を
      # リソースとして個別に同梱する(NGリスト規約: 文字列は xcstrings 経由)。
      - path: WorkoutKit/Resources/Localizable.xcstrings
        buildPhase: resources
        type: file
      # v1.0 §5-3: RestTimer の ActivityAttributes 正本は App 本体側に置き、
      # Widget 側は path 個別追加で読む。これで型は 1 か所だけ存在する。
      - path: WorkoutKit/Features/LiveActivity/RestTimerAttributes.swift
    configFiles:
      Debug: Config/LiveActivity.xcconfig
      Beta: Config/LiveActivity.xcconfig
      Release: Config/LiveActivity.xcconfig
    settings:
      base:
        # Widget Extension 専用 entitlements。App と同じ App Group を共有(§-1.5)。
        CODE_SIGN_ENTITLEMENTS: WorkoutKitLiveActivity/WorkoutKitLiveActivity.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
    info:
      # GENERATE_INFOPLIST_FILE=YES でも、Widget Extension に必須の
      # NSExtension.NSExtensionPointIdentifier は info.properties で
      # 直接指定する必要がある(xcconfig からは渡せない)。
      path: WorkoutKitLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ------------------------------------------------------------------
  # WorkoutKitTests (Swift Testing ユニット、@testable import 用にホスト連結)
  # ------------------------------------------------------------------
  WorkoutKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/WorkoutKitTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: WorkoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutKit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WorkoutKit"
        # Shared.xcconfig が PRODUCT_NAME/PRODUCT_MODULE_NAME を WorkoutKit 固定で
        # 持っているため、テストターゲットもそのままだと同じ swiftmodule を
        # 二重生成してビルドが衝突する。ここで TARGET_NAME に戻す。
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
        # xcconfig 側の SWIFT_STRICT_CONCURRENCY=complete を継承

  # ------------------------------------------------------------------
  # WorkoutKitWatch (watchOS Widget Extension, v0.5 §-1.19)
  # Smart Stack に accessoryRectangular ウィジェットを 1 枚提供。
  # フルアプリではなく Widget Extension のみ(工数最小化)。
  # SwiftData は App Group 経由で共有(URL は appSupport ではなく App Group container)。
  # ------------------------------------------------------------------
  WorkoutKitWatch:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WorkoutKitWatch
        excludes:
          - "**/.gitkeep"
          - "WorkoutKitWatch.entitlements"
      # v1.0 §-1.19: 共有データ受け渡し用 2 ファイルを iPhone App と Widget の
      # 両 target から path-include する。重複コンパイルされるが、各 Bundle に
      # 必要な型を漏れなく含めるための明示的セット。SwiftData 依存は無い。
      - path: WorkoutKit/Shared/TodaySessionSummary.swift
      - path: WorkoutKit/Shared/WatchSummaryBridge.swift
    settings:
      base:
        PRODUCT_NAME: WorkoutKitWatch
        # Shared.xcconfig が PRODUCT_MODULE_NAME=WorkoutKit を強制するため、
        # 明示的に上書きしないと WorkoutKit.swiftmodule が WorkoutKit 本体と
        # 衝突する(Multiple commands produce ...swiftmodule)。
        PRODUCT_MODULE_NAME: WorkoutKitWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.workoutkit.watchkitapp.watchwidget
        # Shared.xcconfig が SDKROOT=iphoneos / SUPPORTED_PLATFORMS=iphoneos*
        # を流し込むので、watchOS target ではここで明示的に上書きする。
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        TARGETED_DEVICE_FAMILY: "4"
        # iPhone 用の Portrait 固定設定は watchOS では不要 / 不正なので空にする。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: ""
        # App Group 共有 entitlements(App 本体と同一)。
        CODE_SIGN_ENTITLEMENTS: WorkoutKitWatch/WorkoutKitWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      # Widget Extension 必須キー(WidgetKit Extension Point)。
      path: WorkoutKitWatch/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ------------------------------------------------------------------
  # WorkoutKitWatchApp (watchOS 単体アプリ, Phase 2-2 Watch 単体記録)
  # WCSession (WatchSyncPayload.swift 契約) 経由で iPhone と
  #   - iPhone → Watch: 最近使った種目リスト(updateApplicationContext)
  #   - Watch → iPhone: クイック記録したセット(transferUserInfo)
  # を同期するスタンドアロン watchOS アプリ本体。
  # Smart Stack Widget (WorkoutKitWatch) を PlugIns として同梱する。
  # ------------------------------------------------------------------
  WorkoutKitWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WorkoutKitWatchApp
        excludes:
          - "**/.gitkeep"
          - "WorkoutKitWatchApp.entitlements"
      # 契約 v1.1: iPhone と watchOS の両ターゲットにコンパイルされる唯一の
      # 共有定義(WatchRecentExercise / WatchLoggedSet / WatchSyncKey / WatchSyncCoder)。
      - path: WorkoutKit/Shared/WatchSyncPayload.swift
      # Watch アプリ単体の Bundle なので、アプリ本体の String Catalog を
      # リソースとして個別に同梱する(NGリスト規約: 文字列は xcstrings 経由)。
      - path: WorkoutKit/Resources/Localizable.xcstrings
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_NAME: WorkoutKitWatchApp
        # Shared.xcconfig が PRODUCT_MODULE_NAME=WorkoutKit を強制するため、
        # WorkoutKitWatch と同様に明示的に上書きする(swiftmodule 衝突防止)。
        PRODUCT_MODULE_NAME: WorkoutKitWatchApp
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.workoutkit.watchkitapp
        # Shared.xcconfig の iphoneos 前提設定を watchOS 向けに上書き(WorkoutKitWatch と同様)。
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: ""
        # App Group 共有 entitlements(App 本体 / WorkoutKitWatch と同一)。
        CODE_SIGN_ENTITLEMENTS: WorkoutKitWatchApp/WorkoutKitWatchApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # 単体 watchOS アプリであることを示す必須キー。
        INFOPLIST_KEY_WKApplication: YES
        # companion-paired(iPhone アプリ必須、Watch 単体インストール不可)。
        # CI run #42 で判明: embed 依存だけでは解決されず、シミュレータへの
        # インストール時に _validateCompanionAppStateInWatchKitApp が
        # 「companion 不明」で失敗する。明示宣言が必須。
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tomo.workoutkit
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_CFBundleDisplayName: WorkoutKit
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      # Smart Stack Widget を PlugIns に同梱(app-extension のデフォルト embed 挙動に任せる)。
      - target: WorkoutKitWatch

  # ------------------------------------------------------------------
  # WorkoutKitUITests (XCUITest プレースホルダ、現状は空。Phase P3 以降で実装)
  # ------------------------------------------------------------------
  WorkoutKitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/WorkoutKitUITests
        excludes:
          - "**/.gitkeep"
        optional: true
    dependencies:
      - target: WorkoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkoutKit
        # 同上(swiftmodule 衝突防止)
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
