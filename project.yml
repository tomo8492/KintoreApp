# project.yml
# CLAUDE.md §-1.7 / §-1.8 / §11 準拠。
# xcodegen で Xcode プロジェクトを生成する。手書き .pbxproj はマージ事故が
# 起きやすいので、本リポジトリは project.yml を真として扱う。
#
# 使い方:
#   $ xcodegen generate
# その後 WorkoutKit.xcodeproj/ がリポジトリ直下に再生成される。
# 生成物は .gitignore せず、初回のみコミットする(他開発者の Xcode 起動を楽にする)。

name: WorkoutKit
options:
  bundleIdPrefix: com.tomo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

# Configurations は 3 種(CLAUDE.md §-1.7)。各 .xcconfig に紐付ける。
configs:
  Debug: debug
  Beta: release
  Release: release

# プロジェクト直下の configFiles はアプリ本体のデフォルト。
# Widget Extension は target 単位で別の xcconfig を割り当てる(下記 targets セクション)。
configFiles:
  Debug: Config/Debug.xcconfig
  Beta: Config/Beta.xcconfig
  Release: Config/Release.xcconfig

# 設定ファイル群と README を Xcode 上のグループとして見せる。
fileGroups:
  - Config
  - CLAUDE.md
  - README.md

targets:
  # ------------------------------------------------------------------
  # WorkoutKit (アプリ本体)
  # ------------------------------------------------------------------
  WorkoutKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutKit
        excludes:
          # 空ディレクトリ維持用、ビルドには不要
          - "**/.gitkeep"
          # entitlements は CODE_SIGN_ENTITLEMENTS から参照されるので
          # ソースファイルとしては扱わない(Bundle にも入れない)
          - "WorkoutKit.entitlements"
          # prompts は ChatGPT 用ドキュメント。アプリ Bundle には含めない
          - "Resources/prompts/**"
          - "Resources/prompts"
      # C3: Live Activity の ActivityAttributes は App と Widget の双方から
      # 参照する必要があるため、Widget 拡張ディレクトリ配下の1ファイルだけを
      # アプリ本体の sources にも個別追加する(モジュール境界を跨いだ型共有)。
      - path: WorkoutKitLiveActivity/SessionLiveActivityAttributes.swift
    settings:
      base:
        # Entitlements (App Group)。CLAUDE.md §-1.5。
        CODE_SIGN_ENTITLEMENTS: WorkoutKit/WorkoutKit.entitlements
        # Info.plist は xcconfig の INFOPLIST_KEY_* と下記 properties をマージし、
        # ビルド時に自動生成する。手書き plist は禁止(CLAUDE.md §-1.7)。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # C3: Live Activity を出すには Info.plist に NSSupportsLiveActivities が必須。
        # GENERATE_INFOPLIST_FILE=YES 環境下では INFOPLIST_KEY_* で渡せる(Bool は YES/NO)。
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        # 個人開発のため自動署名に任せる(P-1 で Team を入れたら手動切替検討)。
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # C3: Widget Extension を本体に同梱して App Store / TestFlight に配布する。
      - target: WorkoutKitLiveActivity
    scheme:
      testTargets:
        - WorkoutKitTests
        - WorkoutKitUITests
      gatherCoverageData: true
      coverageTargets:
        - WorkoutKit
      # Run の StoreKit Configuration を WorkoutKit.storekit に固定する。
      # これが無いとシミュレータで Product.products(for:) が空配列を返し、
      # Paywall に "product not found" が出る(BUG 2 / F-08)。
      #
      # 注: xcodegen 2.45.3 はこの値から `../../WorkoutKit/...` のような
      #     scheme ファイル相対パスで identifier を埋める。Xcode 純正の
      #     スキームエディタが書く形式(プロジェクトルート相対 = bare
      #     "WorkoutKit/Resources/WorkoutKit.storekit")と等価だが、
      #     リポジトリ整合性のため bare 形式に手で揃えてコミットしている。
      #     xcodegen を再実行すると `../../` 形に戻るので、コミット前に
      #     `WorkoutKit.xcodeproj/xcshareddata/xcschemes/WorkoutKit.xcscheme`
      #     の identifier 行を確認すること。
      storeKitConfiguration: WorkoutKit/Resources/WorkoutKit.storekit
      # Run/Test は Debug、Profile/Analyze は Release、Archive は Release。
      # Beta は TestFlight ビルド時に手動切替。
      configs:
        run: Debug
        test: Debug
        profile: Release
        analyze: Debug
        archive: Release

  # ------------------------------------------------------------------
  # WorkoutKitLiveActivity (Widget Extension, C3)
  # CLAUDE.md §1.1 F-03 / §-1.5 準拠。ActivityKit + WidgetKit ベースの
  # Live Activity を提供する。アプリ本体に同梱で配布。
  # ------------------------------------------------------------------
  WorkoutKitLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutKitLiveActivity
        excludes:
          - "**/.gitkeep"
          # 拡張専用 entitlements は CODE_SIGN_ENTITLEMENTS で渡すだけにする
          - "WorkoutKitLiveActivity.entitlements"
      # Widget Extension は別 Bundle なので、アプリ本体の String Catalog を
      # リソースとして個別に同梱する(NGリスト規約: 文字列は xcstrings 経由)。
      - path: WorkoutKit/Resources/Localizable.xcstrings
        buildPhase: resources
        type: file
    configFiles:
      Debug: Config/LiveActivity.xcconfig
      Beta: Config/LiveActivity.xcconfig
      Release: Config/LiveActivity.xcconfig
    settings:
      base:
        # Widget Extension 専用 entitlements。App と同じ App Group を共有(§-1.5)。
        CODE_SIGN_ENTITLEMENTS: WorkoutKitLiveActivity/WorkoutKitLiveActivity.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
    info:
      # GENERATE_INFOPLIST_FILE=YES でも、Widget Extension に必須の
      # NSExtension.NSExtensionPointIdentifier は info.properties で
      # 直接指定する必要がある(xcconfig からは渡せない)。
      path: WorkoutKitLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ------------------------------------------------------------------
  # WorkoutKitTests (Swift Testing ユニット、@testable import 用にホスト連結)
  # ------------------------------------------------------------------
  WorkoutKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WorkoutKitTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: WorkoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutKit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WorkoutKit"
        # Shared.xcconfig が PRODUCT_NAME/PRODUCT_MODULE_NAME を WorkoutKit 固定で
        # 持っているため、テストターゲットもそのままだと同じ swiftmodule を
        # 二重生成してビルドが衝突する。ここで TARGET_NAME に戻す。
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
        # xcconfig 側の SWIFT_STRICT_CONCURRENCY=complete を継承

  # ------------------------------------------------------------------
  # WorkoutKitUITests (XCUITest プレースホルダ、現状は空。Phase P3 以降で実装)
  # ------------------------------------------------------------------
  WorkoutKitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WorkoutKitUITests
        excludes:
          - "**/.gitkeep"
        optional: true
    dependencies:
      - target: WorkoutKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkoutKit
        # 同上(swiftmodule 衝突防止)
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: $(TARGET_NAME)
